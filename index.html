<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasileirão 1600x900 Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            width: 1600px;
            height: 900px;
            background-color: #0b0e14;
            color: #f0f3f8;
            display: grid;
            grid-template-columns: 1060px 540px;
            overflow: hidden;
        }

        .col-tabela {
            padding: 20px;
            background-color: #121620;
            border-right: 2px solid #1f2635;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .wrapper-tabelas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 100%;
        }

        .col-jogos {
            padding: 20px;
            background-color: #0b0e14;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #4ad2ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sub-tempo {
            font-size: 12px;
            color: #7a8b9e;
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background-color: #1a202c;
            color: #7a8b9e;
            padding: 10px 6px;
            text-align: center;
            font-weight: 600;
            font-size: 12px;
        }

        th.Alinhado-esquerda, td.Alinhado-esquerda {
            text-align: left;
            padding-left: 10px;
        }

        td {
            padding: 18.2px 6px;
            text-align: center;
            border-bottom: 1px solid #1a202c;
        }

        .g-libertadores { color: #38ef7d; font-weight: bold; }
        .g-rebaixamento { color: #ff4d4d; font-weight: bold; }

        .escudo-time {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 8px;
            text-align: center;
            line-height: 20px;
            font-size: 9px;
            font-weight: bold;
            color: white;
            background-color: #1a202c;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .destaque-pontos {
            font-weight: bold;
            color: #4ad2ff;
            background-color: rgba(74, 210, 255, 0.1);
            border-radius: 4px;
        }

        .container-cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        .card-jogo {
            background-color: #121620;
            border: 1px solid #1f2635;
            border-radius: 6px;
            padding: 12px 16px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            text-align: center;
            height: 73px;
        }

        .card-jogo.ao-vivo {
            border-color: #00ff66;
            background-color: #0c1f15;
        }

        .time-casa { text-align: right; font-weight: 600; font-size: 14px;}
        .time-fora { text-align: left; font-weight: 600; font-size: 14px;}

        .placar {
            background-color: #1a202c;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 18px;
            margin: 0 15px;
            min-width: 80px;
            letter-spacing: 2px;
        }

        .ao-vivo .placar {
            color: #00ff66;
            background-color: #11311c;
        }

        .status-jogo {
            grid-column: 1 / span 3;
            font-size: 11px;
            color: #7a8b9e;
            margin-top: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .ao-vivo .status-jogo {
            color: #00ff66;
            animation: piscar 1.5s infinite;
        }

        .escudo-jogo {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            vertical-align: middle;
            margin: 0 6px;
            text-align: center;
            line-height: 16px;
            font-size: 8px;
            font-weight: bold;
            color: white;
            background-color: #1a202c;
        }

        @keyframes piscar {
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="col-tabela">
        <h2>Brasileirão Série A <span class="sub-tempo" id="atualizacao-tabela">Conectando...</span></h2>
        <div class="wrapper-tabelas">
            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;">Pos</th>
                        <th class="Alinhado-esquerda">Clube</th>
                        <th style="width: 50px;">P</th>
                        <th style="width: 50px;">J</th>
                        <th style="width: 50px;">V</th>
                        <th style="width: 50px;">SG</th>
                    </tr>
                </thead>
                <tbody id="tabela-esquerda"></tbody>
            </table>

            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;">Pos</th>
                        <th class="Alinhado-esquerda">Clube</th>
                        <th style="width: 50px;">P</th>
                        <th style="width: 50px;">J</th>
                        <th style="width: 50px;">V</th>
                        <th style="width: 50px;">SG</th>
                    </tr>
                </thead>
                <tbody id="tabela-direita"></tbody>
            </table>
        </div>
    </div>

    <div class="col-jogos">
        <h2>Rodada Atual <span class="sub-tempo" id="atualizacao-jogos">Tempo Real</span></h2>
        <div class="container-cards" id="container-jogos"></div>
    </div>
    <script>
        // Nova API aberta estável e livre de bloqueios CORS no GitHub
        const API_URL = "https://workers.dev";

        async function carregarDados() {
            try {
                const resposta = await fetch(API_URL);
                const dados = await resposta.json();

                if (!dados || !dados.tabela || !dados.jogos) {
                    throw new Error("Dados incompletos");
                }

                renderizarTabelas(dados.tabela);
                renderizarJogos(dados.jogos);

                document.getElementById('atualizacao-tabela').innerText = "Tempo Real 5s";
                document.getElementById('atualizacao-jogos').innerText = `Rodada ${dados.rodada_atual || 'Atual'}`;

            } catch (erro) {
                console.error("Erro na API:", erro);
                document.getElementById('atualizacao-tabela').innerText = "Erro de Conexão";
            }
        }

        function renderizarTabelas(tabela) {
            const containerEsq = document.getElementById('tabela-esquerda');
            const containerDir = document.getElementById('tabela-direita');
            containerEsq.innerHTML = "";
            containerDir.innerHTML = "";

            tabela.forEach((time, index) => {
                const pos = index + 1;
                let classeLinha = "";
                if (pos <= 4) classeLinha = "g-libertadores";
                if (pos >= 17) classeLinha = "g-rebaixamento";

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="${classeLinha}">${pos}</td>
                    <td class="Alinhado-esquerda">
                        <span class="escudo-time" style="background-color: ${time.cor_base || '#21262d'}">${time.sigla}</span>
                        ${time.sigla}
                    </td>
                    <td class="destaque-pontos">${time.pontos}</td>
                    <td>${time.jogos}</td>
                    <td>${time.vitorias}</td>
                    <td>${time.saldo_gols > 0 ? '+' + time.saldo_gols : time.saldo_gols}</td>
                `;

                if (pos <= 10) {
                    containerEsq.appendChild(tr);
                } else {
                    containerDir.appendChild(tr);
                }
            });
        }

        function renderizarJogos(jogos) {
            const container = document.getElementById('container-jogos');
            container.innerHTML = "";

            jogos.slice(0, 10).forEach(jogo => {
                const ehAoVivo = jogo.status === "ao-vivo";
                const classeCard = ehAoVivo ? "card-jogo ao-vivo" : "card-jogo";
                const textoStatus = ehAoVivo ? "⏱️ Ao Vivo" : (jogo.status === "encerrado" ? "Encerrado" : jogo.horario);

                const card = document.createElement('div');
                card.className = classeCard;
                card.innerHTML = `
                    <div class="time-casa">
                        ${jogo.casa_sigla} <span class="escudo-jogo" style="background-color: ${jogo.casa_cor}">${jogo.casa_sigla}</span>
                    </div>
                    <div class="placar">${jogo.placar_casa} x ${jogo.placar_fora}</div>
                    <div class="time-fora">
                        <span class="escudo-jogo" style="background-color: ${jogo.fora_cor}">${jogo.fora_sigla}</span> ${jogo.fora_sigla}
                    </div>
                    <div class="status-jogo">${textoStatus}</div>
                `;
                container.appendChild(card);
            });
        }

        // Atualiza a cada 5 segundos cravados
        setInterval(carregarDados, 5000);
        carregarDados();
    </script>
</body>
</html>
